<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>
  <style>
    /* ============================================
       VIBE ZONE - customize everything below
       ============================================ */
    
    :root {
      /* colors - change these */
      --bg-color: #0a0a0a;
      --text-color: #ffffff;
      --accent-color: #ff6b35;
      --input-bg: #1a1a1a;
      --input-border: #333333;
      --success-color: #4ade80;
      --error-color: #f87171;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;

      /* BACKGROUND IMAGE - uncomment and add your image */
      /* background-image: url('your-image.jpg'); */
      /* background-size: cover; */
      /* background-position: center; */
    }

    .container {
      max-width: 500px;
      width: 100%;
      text-align: center;
    }

    /* LOGO - add your logo image or keep as text */
    .logo {
      margin-bottom: 2rem;
    }

    .logo img {
      max-width: 200px;
      height: auto;
    }

    /* if no logo image, style the text */
    .logo-text {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .tagline {
      font-size: 1.25rem;
      opacity: 0.8;
      margin-bottom: 3rem;
      line-height: 1.5;
    }

    /* FORM STYLES */
    .form-container {
      background: rgba(255, 255, 255, 0.05);
      padding: 2rem;
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    .form-title {
      font-size: 1rem;
      margin-bottom: 1.5rem;
      opacity: 0.9;
    }

    .input-group {
      margin-bottom: 1rem;
    }

    input {
      width: 100%;
      padding: 1rem;
      font-size: 1rem;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 8px;
      color: var(--text-color);
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--accent-color);
    }

    input::placeholder {
      color: #666;
    }

    button {
      width: 100%;
      padding: 1rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* MESSAGES */
    .message {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.9rem;
      display: none;
    }

    .message.success {
      display: block;
      background: rgba(74, 222, 128, 0.1);
      color: var(--success-color);
      border: 1px solid var(--success-color);
    }

    .message.error {
      display: block;
      background: rgba(248, 113, 113, 0.1);
      color: var(--error-color);
      border: 1px solid var(--error-color);
    }

    /* LEGAL - required by Laylo */
    .legal {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      opacity: 0.5;
      line-height: 1.5;
    }

    .legal a {
      color: var(--text-color);
      opacity: 0.8;
    }

    /* SOCIAL LINKS - optional */
    .social-links {
      margin-top: 3rem;
      display: flex;
      gap: 1.5rem;
      justify-content: center;
    }

    .social-links a {
      color: var(--text-color);
      opacity: 0.6;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .social-links a:hover {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- LOGO: replace with your image or keep text -->
    <div class="logo">
      <!-- <img src="your-logo.png" alt="Brand Logo"> -->
      <div class="logo-text">BRAND NAME</div>
    </div>

    <!-- TAGLINE -->
    <p class="tagline">
      Something cool is coming. Be the first to know.
    </p>

    <!-- SIGNUP FORM -->
    <div class="form-container">
      <p class="form-title">Join the waitlist</p>
      
      <form id="waitlist-form">
        <div class="input-group">
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="Email address" 
            required
          >
        </div>
        
        <!-- PHONE: uncomment if you want to collect phone for SMS -->
        <!--
        <div class="input-group">
          <input 
            type="tel" 
            id="phone" 
            name="phone" 
            placeholder="Phone number (for text updates)"
          >
        </div>
        -->
        
        <button type="submit" id="submit-btn">
          Notify Me
        </button>
      </form>

      <div id="message" class="message"></div>

      <!-- LEGAL: required by Laylo when collecting contact info -->
      <p class="legal">
        By signing up, you agree to receive updates and marketing messages. 
        View <a href="https://docs.laylo.com/en/articles/6497431-terms-of-service" target="_blank">Terms</a> 
        and <a href="https://docs.laylo.com/en/articles/6497219-privacy-and-gdpr-policy" target="_blank">Privacy Policy</a>.
      </p>
    </div>

    <!-- SOCIAL LINKS: add your handles -->
    <div class="social-links">
      <a href="https://instagram.com/yourhandle" target="_blank">Instagram</a>
      <a href="https://tiktok.com/@yourhandle" target="_blank">TikTok</a>
      <a href="https://twitter.com/yourhandle" target="_blank">Twitter</a>
    </div>

  </div>

  <script>
    const form = document.getElementById('waitlist-form');
    const messageDiv = document.getElementById('message');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // get values
      const email = document.getElementById('email').value.trim();
      const phoneInput = document.getElementById('phone');
      const phone = phoneInput ? phoneInput.value.trim() : null;

      // disable button while submitting
      submitBtn.disabled = true;
      submitBtn.textContent = 'Joining...';
      messageDiv.className = 'message';
      messageDiv.style.display = 'none';

      try {
        const response = await fetch('/api/subscribe', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email, phone }),
        });

        const data = await response.json();

        if (response.ok) {
          messageDiv.textContent = "You're on the list! We'll be in touch soon.";
          messageDiv.className = 'message success';
          form.reset();
        } else {
          messageDiv.textContent = data.error || 'Something went wrong. Try again.';
          messageDiv.className = 'message error';
        }
      } catch (error) {
        messageDiv.textContent = 'Connection error. Please try again.';
        messageDiv.className = 'message error';
      }

      submitBtn.disabled = false;
      submitBtn.textContent = 'Notify Me';
    });
  </script>
</body>
</html>
