<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yuzu Punks - Coming Soon</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- HERO SECTION - add your background image in CSS -->
    <main class="hero">
      
      <!-- LOGO - replace src with your logo -->
      <img src="logo-placeholder.png" alt="Yuzu Punks" class="logo">
      
      <!-- HEADLINE -->
      <h1>Something cute is coming.</h1>
      <p class="subhead">Be the first to know when we drop.</p>
      
      <!-- SIGNUP FORM -->
      <form id="waitlist-form" class="signup-form">
        <div class="input-group">
          <input 
            type="email" 
            id="email" 
            name="email" 
            placeholder="your@email.com" 
            required
          >
          <button type="submit" id="submit-btn">
            <span class="btn-text">Notify Me</span>
            <span class="btn-loading" style="display: none;">...</span>
          </button>
        </div>
        
        <!-- Optional: phone number field (uncomment if you want SMS signups)
        <div class="input-group phone-group">
          <input 
            type="tel" 
            id="phone" 
            name="phone" 
            placeholder="+1 (555) 123-4567"
          >
        </div>
        -->
        
        <p class="form-message" id="form-message"></p>
      </form>
      
      <!-- LEGAL COMPLIANCE - required by Laylo -->
      <p class="legal">
        By signing up, you agree to receive marketing messages and agree to Laylo's 
        <a href="https://docs.laylo.com/en/articles/6497431-terms-of-service" target="_blank">Terms</a> and 
        <a href="https://docs.laylo.com/en/articles/6497219-privacy-and-gdpr-policy" target="_blank">Privacy Policy</a>.
      </p>
      
    </main>
    
    <!-- OPTIONAL: additional content sections -->
    <!--
    <section class="preview">
      <img src="figure-preview.png" alt="Sneak peek">
    </section>
    -->
    
  </div>

  <script src="script.js"></script>
</body>
</html>
